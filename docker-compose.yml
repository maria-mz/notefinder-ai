services:
  db:
    image: pgvector/pgvector:pg17
    container_name: notefinder-db
    environment:
      POSTGRES_USER: notefinder
      POSTGRES_PASSWORD: notefinder
      POSTGRES_DB: notefinder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notefinder -d notefinder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: