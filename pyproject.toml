[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notefinder"
version = "0.1.0"
description = "Search handwritten notes by topic."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3",
    "huggingface_hub>=2.3",
    "psycopg[binary]>=3.3",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2",
    "transformers>=5.21",
    "typer>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[project.scripts]
notefinder = "notefinder.cli:app"

[tool.setuptools.packages.find]
include = ["notefinder*"]

[tool.setuptools.package-data]
notefinder = ["prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
